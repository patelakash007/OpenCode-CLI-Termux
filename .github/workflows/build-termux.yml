name: build-termux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (optional, e.g. v1.0.0)"
        required: false
        type: string

env:
  OPENCODE_VERSION: 1.0.0
  OPENCODE_CHANNEL: latest

permissions:
  contents: write

jobs:
  build-termux:
    name: build-termux
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Set up Zig
        run: |
          echo "=== Installing Zig 0.17.0 ==="
          curl -fsSL https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"
          echo "OPENCODE_REAL_ZIG=/tmp/zig-x86_64-linux-0.17.0/zig" >> "$GITHUB_ENV"
          /tmp/zig-x86_64-linux-0.17.0/zig version

      - name: Set up Rust
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target aarch64-linux-android
          rustup default 1.90.0

      - name: Locate Android NDK
        id: setup-ndk
        run: |
          NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ]; then
            echo "Installing NDK..."
            sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"
            NDK_DIR="/usr/local/lib/android/sdk/ndk/27.0.12077973"
          fi
          echo "NDK path: $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK_DIR=$NDK_DIR" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CFLAGS_aarch64_linux_android=--target=aarch64-linux-android24" >> "$GITHUB_ENV"
          echo "CXXFLAGS_aarch64_linux_android=--target=aarch64-linux-android24" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=--target=aarch64-linux-android24" >> "$GITHUB_ENV"
          echo "=== Patching NDK sys/cdefs.h to allow unversioned/generic triples ==="
          sed -i 's/#error Unversioned target triples are not supported!/\/\/ #error Unversioned target triples are not supported!\n#ifndef __ANDROID_API__\n#define __ANDROID_API__ 24\n#endif\n#ifndef __ANDROID_MIN_SDK_VERSION__\n#define __ANDROID_MIN_SDK_VERSION__ 24\n#endif/' "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/sys/cdefs.h" || true
          echo "=== Patching NDK limits.h to isolate from host glibc ==="
          sed -i 's/__has_include_next(<limits.h>)/0\n#ifndef CHAR_BIT\n#define CHAR_BIT 8\n#define SCHAR_MIN (-128)\n#define SCHAR_MAX 127\n#define UCHAR_MAX 255\n#define SHRT_MIN (-32768)\n#define SHRT_MAX 32767\n#define USHRT_MAX 65535\n#define INT_MIN (-2147483647-1)\n#define INT_MAX 2147483647\n#define UINT_MAX 4294967295U\n#define LONG_MIN (-9223372036854775807L-1L)\n#define LONG_MAX 9223372036854775807L\n#define ULONG_MAX 18446744073709551615UL\n#define LLONG_MIN (-9223372036854775807LL-1LL)\n#define LLONG_MAX 9223372036854775807LL\n#define ULLONG_MAX 18446744073709551615ULL\n#endif/' "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/limits.h" || true

      - name: Clone OpenTUI and cross-compile libopentui.so
        run: |
          echo "=== Cloning OpenTUI v0.8.1 ==="
          git clone --depth 1 --branch v0.8.1 https://github.com/anomalyco/opentui.git /tmp/opentui
          cd /tmp/opentui/packages/native
          echo "=== Preparing Zig dependencies ==="
          sh scripts/prepare-zig-deps.sh
          echo "=== Generating Zig libc.txt for Android ==="
          zig libc > /tmp/android-libc.txt
          echo "=== Patching OpenTUI for Android Bionic ==="
          python3 "$GITHUB_WORKSPACE/packages/cli/script/termux/patch-opentui.py" /tmp/opentui
          cat /tmp/android-libc.txt
          echo "=== Building libopentui.so for aarch64-linux-android.24 ==="
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux-android.24 -Dlibrary-target=aarch64-linux-android.24
          mkdir -p "$GITHUB_WORKSPACE/.build-termux/opentui"
          FOUND_SO=$(find /tmp/opentui -name "libopentui.so" | head -n 1)
          if [ -z "$FOUND_SO" ]; then
            echo "Error: libopentui.so not found in /tmp/opentui!"
            find /tmp/opentui -name "*.so" || true
            exit 1
          fi
          cp -v "$FOUND_SO" "$GITHUB_WORKSPACE/.build-termux/opentui/libopentui.so"
          readelf -d "$GITHUB_WORKSPACE/.build-termux/opentui/libopentui.so"

      - name: Cross-compile opencode-pty
        run: |
          echo "=== Cross-compiling opencode-pty ==="
          cd packages/process-daemon
          echo "OPENCODE_REAL_ZIG=$(command -v zig)" >> "$GITHUB_ENV"
          export OPENCODE_REAL_ZIG=$(command -v zig)
          cargo build --release --target aarch64-linux-android || echo "opencode-pty build exited with code $?"
          mkdir -p "$GITHUB_WORKSPACE/.build-termux/pty"
          if [ -f target/aarch64-linux-android/release/opencode-pty ]; then
            cp -v target/aarch64-linux-android/release/opencode-pty "$GITHUB_WORKSPACE/.build-termux/pty/opencode-pty"
            readelf -d "$GITHUB_WORKSPACE/.build-termux/pty/opencode-pty"
          fi

      - name: Fetch native Termux pty.node
        run: |
          echo "=== Fetching Android ARM64 pty.node ==="
          mkdir -p "$GITHUB_WORKSPACE/.build-termux/pty-node"
          curl -sL https://registry.npmjs.org/@mmmbuto/node-pty-android-arm64/-/node-pty-android-arm64-1.1.2.tgz | tar -xz -C "$GITHUB_WORKSPACE/.build-termux/pty-node"
          readelf -d "$GITHUB_WORKSPACE/.build-termux/pty-node/package/prebuilds/android-arm64/pty.node"

      - name: Install dependencies
        run: |
          bun install --os="*" --cpu="*"

      - name: Generate models catalog snapshot
        run: |
          mkdir -p .cache/models-catalog
          bun packages/core/script/update-models-snapshot.ts .cache/models-catalog/api.json

      - name: Build OpenCode CLI Node Bundle
        run: |
          cd packages/cli
          export OPENCODE_MODELS_SNAPSHOT="$GITHUB_WORKSPACE/.cache/models-catalog/api.json"
          export OPENCODE_TARGET="android-arm64"
          bun run build:node --bundle-only --skip-install

      - name: Package Distribution (tar.gz and .deb)
        run: |
          bash packages/cli/script/termux/package.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-termux-aarch64
          path: release-artifacts/*
          if-no-files-found: error
